structure: gated_delta_core
version: 2
description: >
  Stateful Gated DeltaNet recurrence over Q/K/V, log-decay and update
  strength. The structure owns the recurrent state transition and exposes the
  final state explicitly; projections, causal convolution and output gating
  remain composable neighbouring structures.

reference:
  module: gated_delta_core.reference
  entrypoint: gated_delta_core_ref

boundary:
  symbolic_dims: [B, S, H, D]
  inputs:
    - {name: q, dims: [B, S, H, D], dtype: "@binding"}
    - {name: k, dims: [B, S, H, D], dtype: "@binding"}
    - {name: v, dims: [B, S, H, D], dtype: "@binding"}
    - {name: log_decay, dims: [B, S, H], dtype: "@binding"}
    - {name: beta, dims: [B, S, H], dtype: "@binding"}
    - {name: state, dims: [B, H, D, D], dtype: "@binding", optional: true}
  outputs:
    - {name: out, dims: [B, S, H, D], dtype: "@binding"}
    - {name: final_state, dims: [B, H, D, D], dtype: "@binding", optional: true}

weights: []

variants:
  phase: [decode_recurrent, sequence_scan, wy_chunk]
  state_update: [in_place, explicit_output, snapshot_per_token]
                # snapshot_per_token: token batches (speculative verify,
                # S = 1 + n_draft) write one state snapshot per token and
                # leave the source state slot pristine, so the host can
                # roll back to any accepted position; in-place update under
                # a rollback-capable host is a correctness bug whose
                # symptoms (degenerate text, inflated acceptance) evade
                # perplexity-style gates — adjudicate on end-to-end text
  qk_norm: [l2_in_kernel, host]
  checkpoint: [none, replay_in_region]
                # replay_in_region: the host graph's normally zero-sized
                # checkpoint save nodes become real on checkpoint steps and
                # must be replayed inside the region (or the whole region
                # must decline); silently dropping them corrupts rollback
                # in ways invisible until a rollback occurs

calibration:
  points: []

gates:
  parity:
    metrics: [cosine, max_abs, p99_abs]
    data: real_distribution
  latency:
    baselines: [torch_compile, vendor]
    rule: net_positive_including_state_transition
    per_shape: true
  qualification:
    state_is_explicit: true
    deterministic_transition: true

qualification:
  - "Q/K/V, log-decay and beta must share B/S/H and the same head width"
  - "the state transition is part of the boundary; a route that updates an
     untracked cache is not this structure"
  - "decode and prefill may select different executable forms, but must
     produce a final state accepted by the next invocation"

evidence:
  - "Qwen3.6-35B-A3B decode on RTX 5090 (ggml adapter sm120 target): whole
     cell span (conv + recurrence + gated norm + epilogue) as 4 launches,
     register-resident state, M<=4 verify batches under snapshot_per_token
     + replay_in_region; bit-exact duplicated-token replay across batch
     variants is the acceptance gate"
  - "Qwen3.6/Qwen3.5 hybrid decoder: 48 of 64 layers carry this state"
  - "Nex-N2 hybrid decoder uses the same recurrent and WY chunk boundary at
     H=32 while Qwen3.6 uses H=48"
  - "flashrt/gated-delta-attention v3 validates recurrent and sequence forms
     on RTX 5090 at both H=32 and H=48 with D=128"
